<style>
/* Layout: 全畫面 3D 群島。左上品牌牌、上方時間與工具列、右側索引（手機為底部抽屜）、左側島嶼面板、日誌浮卡 */
:root{
  --paper:#FFF8EE; --paper2:#F6EBDA; --ink:#23383D; --muted:#6B7B7C; --line:#E7D8C2;
  --accent:#E0A526; --accent-ink:#2A1E05; --roof:#E4572E; --teal:#2E7F86;
  --open:#3E9E5C; --soon:#E0A526; --closed:#A0A7A6; --na:#7C8FB0;
  --f-display:"Huninn","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --shadow:0 6px 18px rgba(60,40,10,.14),0 1px 0 rgba(255,255,255,.6) inset;
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px); --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:#BFE3E0;color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;overflow:hidden;
  padding-left:max(0px,0px);padding-right:max(0px,0px)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
#app{position:fixed;inset:0}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.mono{font-family:var(--f-mono);letter-spacing:.06em}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--teal);text-transform:uppercase;font-weight:600}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.25;text-wrap:balance}

/* brand */
.brand{position:absolute;top:calc(12px + var(--st));left:calc(12px + var(--sl));padding:10px 14px;display:flex;gap:12px;align-items:center;z-index:5}
.brand .logo{font-family:var(--f-display);font-size:28px;line-height:1;color:var(--roof);letter-spacing:.02em}
.brand .logo small{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;color:var(--teal);margin-top:4px}
.brand .sub{font-size:12px;color:var(--muted);border-left:1px solid var(--line);padding-left:12px;line-height:1.4}
.brand .sub b{display:block;color:var(--ink);font-weight:700;font-size:13px}

/* toolbars */
.tools{position:absolute;top:calc(12px + var(--st));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:5;max-width:calc(100% - 24px)}
.seg{display:flex;gap:2px;padding:4px;border-radius:999px}
.seg button{border:0;background:none;border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg .live{display:inline-block;width:7px;height:7px;border-radius:50%;background:#E4572E;margin-right:5px;vertical-align:1px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
.tb{display:flex;gap:2px;padding:4px;border-radius:14px;overflow-x:auto;max-width:100%}
.tb button{border:0;background:none;border-radius:10px;padding:4px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;color:var(--muted);min-width:46px}
.tb button svg{width:18px;height:18px}
.tb button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.corner{position:absolute;top:calc(12px + var(--st));right:calc(356px + var(--sr));display:flex;gap:6px;z-index:5}
.pill{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;cursor:pointer;box-shadow:var(--shadow);font-size:13px;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* live chip */
.livechip{position:absolute;left:calc(12px + var(--sl));bottom:calc(12px + var(--sb));padding:8px 12px;display:flex;align-items:center;gap:10px;z-index:5;font-size:12.5px}
.livechip .dot{width:8px;height:8px;border-radius:50%;background:var(--open);animation:pulse 2s infinite}
.livechip b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* labels */
#labels{position:absolute;inset:0;pointer-events:none;z-index:3}
.lab{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 6px;font-size:12.5px;white-space:nowrap;box-shadow:0 3px 8px rgba(60,40,10,.18);display:flex;align-items:center;gap:6px}
.lab .no{font-family:var(--f-mono);font-size:10.5px;background:var(--ink);color:var(--paper);border-radius:999px;padding:0 6px}
.lab .od{width:7px;height:7px;border-radius:50%}
.lab.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lab.sel .no{background:var(--accent);color:var(--accent-ink)}
.hideLabels .lab{display:none}

/* index panel */
.index{position:absolute;top:0;right:0;bottom:0;width:340px;background:var(--paper);border-left:1px solid var(--line);z-index:6;display:flex;flex-direction:column;
  padding:calc(16px + var(--st)) calc(16px + var(--sr)) calc(12px + var(--sb)) 16px;gap:12px}
.index .head{display:flex;flex-direction:column;gap:6px}
.index h2{font-size:26px}
.index .meta{font-size:12.5px;color:var(--muted)}
.quizcard{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--paper2);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.quizcard b{display:block;font-family:var(--f-display);font-weight:400;font-size:16px}
.quizcard span{font-size:12px;color:var(--muted)}
.quizcard i{margin-left:auto;font-style:normal;color:var(--roof);font-size:18px}
.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;background:#fff;color:var(--ink)}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px;cursor:pointer;font-size:13px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.list{overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;margin:0 -6px;padding:0 6px}
.row{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;padding:9px 8px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;text-align:left;width:100%;border-radius:8px}
.row:hover{background:var(--paper2)}
.row.sel{background:var(--paper2);box-shadow:inset 3px 0 0 var(--roof)}
.row .n{font-family:var(--f-display);font-size:22px;color:var(--roof);font-style:italic}
.row .t{font-weight:500;min-width:0}
.row .t small{display:block;color:var(--muted);font-size:12px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .c{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.row .c b{color:var(--open)}
.foot{font-size:11.5px;color:var(--muted);line-height:1.5}
.foot a{color:var(--teal)}

/* detail panel */
.detail{position:absolute;top:calc(84px + var(--st));left:calc(12px + var(--sl));bottom:calc(64px + var(--sb));width:330px;z-index:7;display:flex;flex-direction:column;overflow:hidden}
.detail .dh{padding:14px 16px 10px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.detail .x{position:absolute;top:8px;right:8px;border:0;background:none;font-size:20px;cursor:pointer;width:32px;height:32px;border-radius:50%}
.detail .x:hover{background:var(--paper2)}
.detail h3{font-size:24px}
.detail .tag{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:#fff;display:inline-flex;align-items:center;gap:5px}
.chip .od{width:7px;height:7px;border-radius:50%}
.db{overflow-y:auto;padding:8px 12px 14px;display:flex;flex-direction:column;gap:8px}
.bitem{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.bitem .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bitem b{font-weight:700}
.st{font-size:11.5px;border-radius:999px;padding:1px 8px;white-space:nowrap;font-weight:500}
.st.open{background:#E3F3E7;color:#226B3A}.st.soon{background:#FBEFCF;color:#7A5605}.st.closed{background:#ECEEEE;color:#555F5F}.st.na{background:#E6ECF6;color:#3C5379}
.bitem .th{font-size:13px;color:var(--muted)}
.bitem .hr{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.bitem .nt{font-size:12.5px;background:#FDF1E6;border-radius:8px;padding:4px 8px;color:#8A3D1C}
.bitem .lk{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px}
.bitem a,.detail a{color:var(--teal);text-underline-offset:3px}
.sect{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--muted);margin-top:6px}

/* log */
.log{position:absolute;left:calc(12px + var(--sl));bottom:calc(60px + var(--sb));width:340px;max-height:60%;z-index:8;display:flex;flex-direction:column;overflow:hidden}
.log .lh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.log .lb{overflow-y:auto;padding:10px 14px 14px;display:flex;flex-direction:column;gap:10px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-weight:400;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}
.ev{display:grid;grid-template-columns:58px 1fr;gap:8px;font-size:13px}
.ev .d{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.hourbar{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;height:40px;align-items:end}
.hourbar i{background:var(--teal);border-radius:2px 2px 0 0;opacity:.75}
.hourbar i.now{background:var(--roof);opacity:1}
.hb-x{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10px;color:var(--muted)}

/* modal */
.scrim{position:absolute;inset:0;background:rgba(35,56,61,.35);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{max-width:420px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px}
.modal h3{font-size:24px}
.modal p{margin:0;color:var(--muted)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{border:0;border-radius:999px;padding:8px 18px;cursor:pointer;background:var(--ink);color:var(--paper);font-weight:500}
.btn.bkgo{display:block;text-align:center;text-decoration:none;padding:12px 18px;font-size:15px;background:var(--accent);color:var(--accent-ink);font-weight:700;overflow-wrap:anywhere}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.opts{display:grid;gap:8px}
.opts button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer}
.opts button:hover{border-color:var(--roof)}
.dots{display:flex;gap:5px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--roof)}

.st.self{background:#DDF0F1;color:#1E5F64}
.lab .fc:empty{display:none}.lab .fc{font-family:var(--f-mono);font-size:10.5px;background:#F5B921;color:#2A1E05;border-radius:999px;padding:0 6px}
.lab.dim{opacity:.45}
.fchips{display:flex;flex-wrap:wrap;gap:6px;padding:0 2px}
.fchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.fchip[aria-pressed="true"]{background:#F5B921;border-color:#E0A526;color:#2A1E05}
.linkbtn{border:0;background:none;color:var(--teal);text-decoration:underline;cursor:pointer;font-size:12px;padding:0 4px}
.svcs{display:grid;gap:8px;padding:0 2px 8px}
.svc{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;text-decoration:none;color:var(--ink)}
.svc:hover{border-color:var(--teal)}
.svc .sk{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:var(--roof)}
.svc b{font-weight:500}.svc span:last-child{font-size:12.5px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:2px 0;font-size:12.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;user-select:text}
.amen{display:flex;flex-wrap:wrap;gap:4px}
.amen span{font-size:11px;background:var(--paper2);border-radius:6px;padding:1px 6px;color:var(--muted)}
.amen span.on{background:#F5B921;color:#2A1E05}
.sites{margin:2px 0;padding-left:1.2em;font-size:12.5px;color:var(--muted)}
.evs{display:flex;flex-direction:column;gap:3px}
.evs a{font-size:12.5px;text-decoration:none;color:var(--ink)}
.evs a:hover{text-decoration:underline}
.evs .et{font-family:var(--f-mono);font-size:10.5px;background:#FDE3D9;color:#8A2E14;border-radius:5px;padding:0 5px;margin-right:6px}
.ev a{color:var(--ink);text-decoration:none}.ev a:hover{text-decoration:underline}
.bookform{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:14px;background:linear-gradient(180deg,#FFF1D6,#FFF8EE);border:1px solid #F0D49A}
.bookform label{font-family:var(--f-display);font-size:17px}
.bfrow{display:flex;gap:6px}.bfrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;background:#fff;color:var(--ink)}
.bfrow .btn{white-space:nowrap;padding:8px 14px}
.bookform .hint{font-size:11.5px;color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.steps span::before{content:"✓ ";color:var(--open)}
.steps span.now::before{content:"⏳ "}
.steps span.now{color:var(--ink)}
@media (max-width:760px){.quizcard{display:none}}
/* fallback */
.nogl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--ink)}

/* mobile: index becomes bottom sheet */
@media (max-width:760px){
  .brand{padding:8px 10px}.brand .logo{font-size:22px}.brand .sub{display:none}
  .tools{top:calc(64px + var(--st));left:12px;right:12px;transform:none;max-width:none;align-items:stretch}
  .seg{overflow-x:auto}
  .corner{right:calc(12px + var(--sr))}
  .corner .pill.opt{display:none}
  .index{top:auto;left:0;width:auto;height:44%;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;
    padding-left:max(16px,var(--sl));padding-right:max(16px,var(--sr));box-shadow:0 -8px 24px rgba(60,40,10,.16);transition:height .25s}
  .index.min{height:calc(118px + var(--sb))}
  .index .grab{display:block}
  .index h2{font-size:20px}
  .detail{top:auto;left:0;right:0;bottom:0;width:auto;height:58%;border-radius:18px 18px 0 0;padding-bottom:var(--sb)}
  .livechip{bottom:auto;top:calc(12px + var(--st));left:auto;right:calc(12px + var(--sr));display:none}
  .log{left:12px;right:12px;width:auto;bottom:auto;top:calc(150px + var(--st));max-height:50%}
}
.grab{display:none;width:40px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 2px;border:0;padding:0;cursor:pointer}
@media (prefers-reduced-motion:reduce){.seg .live,.livechip .dot{animation:none}.index{transition:none}}
</style>

function buildRoutes(){

  const RC=HEXR*GAP,cells=new Map(),key=(q,r)=>q+','+r;
  const DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
  ISLANDS.forEach(I=>{cells.set(key(I.q,I.r),[I.q,I.r]);DIRS.forEach(([dq,dr])=>cells.set(key(I.q+dq,I.r+dr),[I.q+dq,I.r+dr]))});

  const addV=(x,z)=>{const k=vk(x,z);if(!V.has(k)){V.set(k,new THREE.Vector3(x,.12,z));adj.set(k,new Set())}return k};
  cells.forEach(([q,r])=>{const [x0,z0]=axial(q,r);const cx=x0-W3.c[0],cz=z0-W3.c[1];const ks=[];
    for(let k=0;k<6;k++){const a=k*Math.PI/3;ks.push(addV(cx+Math.cos(a)*RC,cz+Math.sin(a)*RC))}
    for(let k=0;k<6;k++){const a=ks[k],b=ks[(k+1)%6];adj.get(a).add(b);adj.get(b).add(a)}});

      adj.get(u).forEach(v=>{const d=dist.get(u)+V.get(u).distanceTo(V.get(v));if(!dist.has(v)||d<dist.get(v)){dist.set(v,d);prev.set(v,u);todo.add(v)}})}

  BK.editions=books.slice(0,8).sort((a,b)=>b.score-a.score).slice(0,5);BK.pick=0;
  await loadEdition(BK.editions[0],sig);
}
async function loadEdition(e,sig){
  BK.title=e.title;BK.rows=[];BK.detail=CAT+'/bookDetail/'+e.id;renderBook();
  step('讀取「'+e.title.split(/[\/:=]/)[0].trim()+'」的各館館藏');
  await host('navigate',{url:BK.detail,tabId:BK.tab},sig);
  await waitText(BK.tab,x=>/冊數\/卷期[\s\S]*預約等待人數[\s\S]*\n\t?\S/.test(x)&&!/正在載入中/.test(x),sig);
  const f=txtOf(await host('find',{query:'一般館藏',tabId:BK.tab},sig));const ref=(f.match(/\[(ref_\d+)\]/)||[])[1];
  if(ref)await host('computer',{action:'scroll_to',ref,tabId:BK.tab},sig);
  const rp=txtOf(await host('read_page',{tabId:BK.tab,filter:'interactive',max_chars:8000},sig));
  const seg=rp.split(/checkbox "\d+"/).slice(1).map(s=>s.split(/點擊此處|社群分享|link "線上取用"/)[0]).join('\n');
  const refs=[...seg.matchAll(/link "(\d+)" \[(ref_\d+)\]/g)].map(x=>x[2]).slice(0,8);
  const seen=new Set();
  for(const r of refs){await host('computer',{action:'left_click',ref:r,tabId:BK.tab,action_summary:'展開這本書的館藏地清單'},sig);await sleep(1200,sig);
    const t=txtOf(await host('get_page_text',{tabId:BK.tab,max_chars:30000},sig));parseHoldings(t).forEach(x=>{const k=x.loc+'|'+x.call+'|'+x.st;if(!seen.has(k)){seen.add(k);BK.rows.push(x)}})}
  BK.at=fm(tp(new Date()).min);aggregate();step(BK.rows.length?`讀到 ${BK.rows.length} 冊的館藏地`:'這個版本目前沒有可列出的館藏地');
}
function aggregate(){const m=new Map();BK.rows.forEach(r=>{const b=locToBranch(r.loc);const k=b.n;const o=m.get(k)||{...b,shelf:0,out:0,other:0,due:[]};
  if(/書在館/.test(r.st))o.shelf++;else if(/外借/.test(r.st)){o.out++;const d=(r.st.match(/\d{4}-\d{2}-\d{2}/)||[])[0];if(d)o.due.push(d)}else o.other++;m.set(k,o)});
  const t=nowT();BK.by=[...m.values()].map(o=>({...o,due:o.due.sort()[0]||'',open:o.i>=0?isOpen(status(ISLANDS[o.i].b[o.bi],t).s):false}))
    .sort((a,b)=>(b.shelf>0)-(a.shelf>0)||(b.open-a.open)||b.shelf-a.shelf||(b.out+b.other)-(a.out+a.other));
  S.bookHits={};BK.by.forEach(o=>{if(o.i>=0)S.bookHits[o.n]=o});tick();}
async function lookupTopic(q,sig){
  BK.mode='topic';step('請 Claude 判斷這本書的主題');
  const list=[];ISLANDS.forEach(I=>I.b.forEach(b=>{if(b.f&&!b.closed)list.push(b.n+'｜'+b.f)}));
  const ans=await SAMPLE.json(`讀者輸入了一本喜歡的書：「${q}」。\n下面是臺北市立圖書館各分館的館藏特色（分館｜特色）：\n${list.join('\n')}\n\n請判斷這本書的主題，從清單中挑出 1 到 3 間館藏特色最相關的分館。分館名稱必須和清單完全一樣，不要編造書的內容或作者；不確定這本書是什麼時，就依書名字面判斷並在 subject 說明。只回覆 JSON：{"subject":"一句話說明主題","picks":[{"n":"分館名稱","why":"一句話理由"}]}`,{modelTier:'quick',signal:sig});
  const ok=[];(ans?.picks||[]).forEach(p=>{const c=CORE.find(x=>x.n===String(p.n));if(c&&!ISLANDS[c.i].b[c.bi].closed&&!ok.some(o=>o.n===c.n))ok.push({...c,why:String(p.why||'').slice(0,80)})});
  BK.topic={subject:String(ans?.subject||'').slice(0,120),picks:ok.slice(0,3)};S.bookHits={};ok.forEach(o=>S.bookHits[o.n]={...o,topic:1});tick();
  step(ok.length?'找到主題相近的島':'沒有找到合適的島');
}
/* 館藏特色關鍵字：只比對完整關鍵字（臺/台視為相同） */
const FKW={'旅遊':['旅遊','旅行','遊記'],'家政':['家政','家事','收納','縫紉'],'中國文學':['中國文學','古典文學','唐詩','宋詞','詩經','紅樓夢','三國演義','西遊記','水滸傳'],
 '禮俗':['禮俗','民俗','習俗','婚禮','節慶'],'企業管理':['企業管理','管理學','領導','創業','經營'],'勞工問題':['勞工','勞動'],'大眾傳播':['大眾傳播','傳播','新聞','媒體'],
 '親職教育':['親職','教養','育兒','親子','繪本'],'美術':['美術','繪畫','素描','水彩','藝術史'],'漫畫':['漫畫','動漫'],'視障資料':['視障','點字'],'傳記':['傳記','自傳','回憶錄'],
 '商品行銷':['行銷','廣告','品牌'],'飲食文化':['飲食','美食','料理','食譜','烹飪','甜點','咖啡'],'城市發展':['城市','都市'],'生活保健':['保健','健康','養生'],
 '歐洲文化':['歐洲','法國','德國','義大利','英國','西班牙'],'天文':['天文','星空','宇宙','星座','太空'],'天文氣象':['天文','氣象','天氣','颱風','星空','宇宙'],
 '園藝':['園藝','植物','花園','盆栽','種菜'],'生態保育':['生態','保育','野生動物','自然觀察'],'表演藝術':['表演藝術','戲劇','劇場','舞蹈'],
 '體育':['體育','運動','棒球','籃球','足球','跑步','健身'],'動物':['動物','寵物','貓','狗','鳥類'],'社會福利':['社會福利','社工','長照'],'建築美學':['建築'],
 '音樂':['音樂','樂理','鋼琴','吉他','爵士'],'客家文化':['客家'],'原住民族文化':['原住民','部落'],'科普':['科普','科學','物理','化學'],'學校教育':['學校教育','教學','教師'],
 '法律':['法律','法學','民法','刑法','憲法'],'考試銓敘':['國考','高普考','公職','銓敘'],'大陸資料':['中國大陸','兩岸'],'茶藝':['茶藝','茶道','茶'],
 '臺灣文學':['臺灣文學'],'鄉土文化':['鄉土'],'聽障資料':['聽障','手語'],'臺灣史':['臺灣史','臺灣歷史','日治'],'中國醫藥':['中醫','中藥','針灸','本草'],'臺北史蹟':['臺北史','古蹟','史蹟','艋舺']};
function lookupLocal(q){BK.mode='topic';BK.local=true;const s=q.replace(/台/g,'臺');
  const hits=CORE.map(c=>{const b=ISLANDS[c.i].b[c.bi];const k=b.f&&!b.closed?(FKW[b.f]||[b.f]).find(w=>s.includes(w)):null;return k?{...c,k}:null}).filter(Boolean)
    .sort((a,b)=>b.k.length-a.k.length).slice(0,3);
  BK.topic={subject:'',picks:hits.map(h=>({...h,why:'館藏特色：'+ISLANDS[h.i].b[h.bi].f}))};S.bookHits=hits.length?{}:null;hits.forEach(o=>S.bookHits[o.n]={...o,topic:1});tick()}
async function startBook(q){
  q=q.trim();if(!q)return;if(BK.ctl)BK.ctl.abort();const ctl=new AbortController();BK.ctl=ctl;
  Object.assign(BK,{busy:true,q,title:'',editions:[],rows:[],by:[],steps:[],err:'',topic:null,local:false,mode:HOST?'host':'topic'});S.bookHits=null;openBook();
  try{
    if(HOST){try{await lookupHost(q,ctl.signal)}catch(e){if(e.code==='server_not_connected'||e.code==='not_in_manifest'||e.code==='capability_disabled'||e.code==='not_granted'){HOST=false;BK.mode='topic';if(SAMPLE)await lookupTopic(q,ctl.signal);else lookupLocal(q)}else throw e}}
    else if(SAMPLE)await lookupTopic(q,ctl.signal);else lookupLocal(q);
    sailToBest();
  }catch(e){BK.err=errCopy(e)}
  finally{if(BK.ctl===ctl){BK.busy=false;BK.ctl=null}renderBook()}
}
function errCopy(e){const c=e&&e.code;return c==='cancelled'?'已停止。':c==='none'?'館藏系統找不到這本書的紙本圖書，試試完整書名、作者或 ISBN。':c==='timeout'?'館藏系統回應太慢，稍後再試一次。':c==='approval_required'?'需要你允許網頁使用瀏覽器，按「重新查詢」再試一次。':c==='rate_limited'?'查詢太頻繁，等一下再試。':c==='not_granted'||c==='sampling_disabled'?'這個畫面無法使用 Claude 推薦，請用下方連結到館藏系統查詢。':c==='invalid_json'||c==='refused'||c==='empty_completion'?'沒能判斷這本書的主題，換個寫法試試。':'查詢中斷了（'+(c||'未知錯誤')+'），可以再試一次。'}
function sailToBest(){const ok=BK.by.filter(o=>o.i>=0);const best=BK.mode==='host'?(ok.find(o=>o.shelf&&o.open)||ok.find(o=>o.shelf)||ok.find(o=>o.open)||ok[0]):BK.topic?.picks?.[0];if(!best)return;sail(best.i);}
function sail(i){if(!W3.ok)return;focusIsland(i);S.sel=-1;
  if(W3.quest){W3.scene.remove(W3.quest.b);W3.quest=null}
  const p=W3.paths.find(x=>x.b===i);if(!p)return;const b=W3.boats[0].b.clone();b.scale.setScalar(2.1);
  b.traverse(o=>{if(o.isMesh&&o.geometry.type==='BoxGeometry'&&o.position.y>.8){o.material=new THREE.MeshStandardMaterial({color:0xF5B921,emissive:0xF5B921,emissiveIntensity:.6})}});
  W3.scene.add(b);W3.quest={b,p,u:0}}
function openBook(){S.sel=-1;labEls.forEach(l=>l.classList.remove('sel'));renderBook();if(innerWidth<=760)$('index').classList.add('min')}
function renderBook(){
  const el=$('detail');el.hidden=false;el.dataset.mode='book';const t=nowT();
  const head=`<button class="x" type="button" id="dx" aria-label="關閉">×</button><div class="dh"><div class="eyebrow">Book Voyage · ${BK.mode==='host'?'即時館藏':BK.local?'館藏查詢':'主題航線'}</div><h3>${esc(BK.title?BK.title.split(' / ')[0]:'「'+BK.q+'」')}</h3>
    ${BK.title?`<div class="tag">${esc((BK.editions[BK.pick]||{}).au||'')}${(BK.editions[BK.pick]||{}).pub?' · '+esc(BK.editions[BK.pick].pub):''}</div>`:''}
    <div class="steps">${BK.steps.map((s,k)=>`<span class="${k===BK.steps.length-1&&BK.busy?'now':''}">${esc(s)}</span>`).join('')}${BK.busy?'<button type="button" class="linkbtn" id="bkStop">停止</button>':''}</div></div>`;
  let body='';
  if(BK.mode==='host'&&BK.editions.length>1)body+=`<div class="sect">其他版本</div><div class="fchips">${BK.editions.map((e,k)=>`<button type="button" class="fchip" data-ed="${k}" aria-pressed="${k===BK.pick}">${esc(e.pub.split(',').pop()||e.title.slice(0,8))} · ${e.total} 冊</button>`).join('')}</div>`;
  if(BK.mode==='host'&&BK.by.length){const tot=BK.by.reduce((a,o)=>({s:a.s+o.shelf,o:a.o+o.out,x:a.x+o.other}),{s:0,o:0,x:0});const ed=BK.editions[BK.pick]||{};
    body+=`<div class="chips"><span class="chip"><span class="od" style="background:${tot.s?SCOL.open:SCOL.closed}"></span>在架 ${tot.s}</span><span class="chip">外借 ${tot.o}</span><span class="chip">調撥/展覽 ${tot.x}</span>${ed.wait?`<span class="chip">預約等待 ${ed.wait} 人</span>`:''}</div>
    <p class="th" style="margin:0">${tot.s?'有館現在架上就有，船已經開往最近能借到的那座島。':'目前每一冊都不在架上，可以預約，書到後選一座方便的島取書。'}</p><div class="sect">有這本書的據點</div>`;
    body+=BK.by.map(o=>{const isl=o.i>=0?ISLANDS[o.i]:null;const st=isl?status(isl.b[o.bi],t):null;
      return`<div class="bitem"><div class="top"><b>${esc(o.n)}</b>${st?`<span class="st ${st.s}">${esc(st.label)}</span>`:''}</div>
      <div class="th">${isl?esc(islName(isl)):'未對應到島嶼'} · ${o.shelf?`<b style="color:#226B3A">在架 ${o.shelf}</b>`:'在架 0'}${o.out?` · 外借 ${o.out}${o.due?'（最早 '+o.due.slice(5).replace('-','/')+' 到期）':''}`:''}${o.other?` · 調撥/展覽 ${o.other}`:''}</div>
      ${isl?`<div class="lk"><button type="button" class="linkbtn" data-go="${o.i}" data-b="${o.bi}" style="padding:0">⛵ 航向這座島</button></div>`:''}</div>`}).join('');
    body+=`<p class="foot" style="margin:0">館藏讀自北市圖館藏查詢系統（${esc(BK.at)}）。<a href="${BK.detail}" target="_blank" rel="noopener">到館藏系統預約 ↗</a></p>`;
  }
  if(BK.mode==='topic'&&BK.local&&BK.q){
    body+=`<a class="btn bkgo" href="${searchURL(BK.q)}" target="_blank" rel="noopener">到北市圖查「${esc(BK.q)}」 ↗</a>
    <p class="th" style="margin:0">在北市圖館藏查詢可以看到哪幾館有這本書、現在在不在架上，也可以直接預約。</p>
    <p class="foot" style="margin:0">也可以查：<a href="${booksURL(BK.q)}" target="_blank" rel="noopener">博客來 ↗</a>　<a href="${gbooksURL(BK.q)}" target="_blank" rel="noopener">Google 圖書 ↗</a></p>`;
    if(BK.topic&&BK.topic.picks.length){body+=`<div class="sect">館藏特色相關的島</div><p class="th" style="margin:0">依書名裡的主題關鍵字推薦，不代表這幾館一定有這本書。</p>`;
      body+=BK.topic.picks.map(o=>{const b=ISLANDS[o.i].b[o.bi];const st=status(b,t);return`<div class="bitem"><div class="top"><b>${esc(o.n)}</b><span class="st ${st.s}">${esc(st.label)}</span></div><div class="th">${esc(islName(ISLANDS[o.i]))} · ${esc(o.why)}</div><div class="lk"><button type="button" class="linkbtn" data-go="${o.i}" data-b="${o.bi}" style="padding:0">⛵ 航向這座島</button></div></div>`}).join('')}
  }
  if(BK.mode==='topic'&&!BK.local&&BK.topic){body+=`<div class="nt">這個畫面不能連到館藏系統，以下是依主題推薦的島，不代表一定有這本書。要確認哪一館有書，請用下方連結。</div>${BK.topic.subject?`<p class="th" style="margin:0">${esc(BK.topic.subject)}</p>`:''}`;
    body+=BK.topic.picks.map(o=>{const b=ISLANDS[o.i].b[o.bi];const st=status(b,t);return`<div class="bitem"><div class="top"><b>${esc(o.n)}</b><span class="st ${st.s}">${esc(st.label)}</span></div><div class="th">${esc(islName(ISLANDS[o.i]))} · ${esc(o.why)}</div><div class="lk"><button type="button" class="linkbtn" data-go="${o.i}" data-b="${o.bi}" style="padding:0">⛵ 航向這座島</button></div></div>`}).join('')||'<p class="th">沒有找到館藏特色相近的島。</p>';
  }
  if(BK.err)body+=`<div class="nt">${esc(BK.err)}</div>${BK.busy?'':'<button type="button" class="btn ghost" id="bkRetry" style="align-self:flex-start">重新查詢</button>'}`;
  if(BK.q&&!BK.local)body+=`<p class="foot" style="margin:0"><a href="${searchURL(BK.q)}" target="_blank" rel="noopener">在北市圖館藏系統搜尋「${esc(BK.q)}」 ↗</a></p>`;
  el.innerHTML=head+`<div class="db">${body}</div>`;
  $('dx').onclick=()=>{if(BK.ctl)BK.ctl.abort();S.bookHits=null;el.dataset.mode='';closeDetail();tick()};
  const st=$('bkStop');if(st)st.onclick=()=>BK.ctl&&BK.ctl.abort();
  const rt=$('bkRetry');if(rt)rt.onclick=()=>startBook(BK.q);
  el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>sail(+b.dataset.go));
  el.querySelectorAll('[data-ed]').forEach(b=>b.onclick=async()=>{if(BK.busy)return;const k=+b.dataset.ed;BK.pick=k;BK.busy=true;BK.err='';const ctl=new AbortController();BK.ctl=ctl;
    try{await loadEdition(BK.editions[k],ctl.signal);sailToBest()}catch(e){BK.err=errCopy(e)}finally{BK.busy=false;BK.ctl=null;renderBook()}});
}
